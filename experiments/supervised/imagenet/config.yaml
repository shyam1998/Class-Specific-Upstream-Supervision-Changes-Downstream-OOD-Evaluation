study: external_imagenet_rotation4_leave_one_out
design_revision: rotation4_v1
source_design: v2_semantic_diversity
dataset:
  name: ILSVRC2012
  root: ${IMAGENET_ROOT}
  train_dir: train
  val_dir: val
source_manifest: manifests/semantic_groups_frozen_v2.json
rotation:
  models: [M1, M2, M3, M4]
  slot_roles: [a, b, r1, r2]
upstream:
  architecture: resnet50
  pretrained: false
  output_dim: 80
  seeds: [0, 1]
  epochs: 100
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  effective_batch_size: 256
  microbatch_size: 64
  accumulation_steps: 4
  initial_lr: 0.1
  warmup_epochs: 5
  schedule: warmup_cosine
  amp: true
  checkpoint_every: 5
downstream:
  feature_dim: 2048
  knn_k: 50
  probe:
    classes: 20
    batch_size: 512
    epochs: 50
    optimizer: sgd
    momentum: 0.9
    weight_decay: 0.0
    initial_lr: 0.1
    schedule: cosine
bootstrap:
  draws: 10000
  seed: 20260909
paths:
  namespace: rotation4_v1
  rotation_manifest_json: manifests/rotation4_v1/semantic_groups_rotation4_v1.json
  rotation_manifest_csv: manifests/rotation4_v1/semantic_groups_rotation4_v1.csv
  rotation_manifest_hash: manifests/rotation4_v1/semantic_groups_rotation4_v1.sha256
  preregistration: manifests/rotation4_v1/preregistration.json
  preregistration_hash: manifests/rotation4_v1/preregistration.sha256
  dry_audit_json: artifacts/rotation4_v1/dry_run_audit.json
  dry_audit_md: artifacts/rotation4_v1/dry_run_audit.md
  source_guard: artifacts/rotation4_v1/protected_source_artifact_guard.json
  run_manifest: artifacts/rotation4_v1/run_manifest.json
  checkpoints: checkpoints/rotation4_v1
  features: features/rotation4_v1
  logs: logs/rotation4_v1
  artifacts: artifacts/rotation4_v1
  reports: reports/rotation4_v1
